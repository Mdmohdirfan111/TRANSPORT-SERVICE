<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transport Service Receipt Generator</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- html2pdf.js for direct PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- Controls Header -->
    <div class="controls-bar">
      <h2><i class="fa-solid fa-truck-fast"></i> Transport Receipt Generator</h2>
      <div class="btn-group">
        <button id="add-row-btn" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> Add Row</button>
        <button id="add-col-btn" class="btn btn-secondary"><i class="fa-solid fa-table-columns"></i> Add Column</button>
        <button id="download-pdf-btn" class="btn btn-primary"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
      </div>
    </div>

    <!-- Document Card (Exported as PDF) -->
    <div id="receipt-card" class="receipt-card">
      
      <!-- Top Accent Bar -->
      <div class="accent-bar"></div>

      <!-- Service Details Header -->
      <header class="receipt-header">
        <div class="header-main">
          <input 
            type="text" 
            id="service-name-input" 
            class="styled-input title-input" 
            placeholder="INPUT YOUR TRANSPORT SERVICE NAME" 
            value=""
          />
        </div>
        <div class="header-details">
          <div class="input-field-group">
            <i class="fa-solid fa-phone input-icon"></i>
            <input 
              type="text" 
              id="mobile-input" 
              class="styled-input detail-input" 
              placeholder="ENTER MOBILE NUMBER"
              value=""
            />
          </div>
          <div class="input-field-group">
            <i class="fa-solid fa-location-dot input-icon"></i>
            <input 
              type="text" 
              id="address-input" 
              class="styled-input detail-input" 
              placeholder="ENTER YOUR ADDRESS"
              value=""
            />
          </div>
        </div>
      </header>

      <!-- Dynamic Transport Details Table -->
      <section class="table-container">
        <table id="details-table">
          <thead>
            <tr id="table-head-row">
              <th>Location</th>
              <th>Route</th>
              <th>Vehicle Number</th>
              <th>Cost (₹)</th>
              <th class="action-col">Action</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td><input type="text" class="table-input" placeholder="Enter Location"></td>
              <td><input type="text" class="table-input" placeholder="Enter Route"></td>
              <td><input type="text" class="table-input" placeholder="Enter Vehicle No."></td>
              <td><input type="number" class="table-input cost-input" placeholder="0.00"></td>
              <td class="action-col"><button class="delete-row-btn" title="Remove Row"><i class="fa-solid fa-trash-can"></i></button></td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Total Summary Bar -->
      <div class="summary-card">
        <span class="total-label">TOTAL COST:</span>
        <span class="total-amount" id="total-cost-display">₹0.00</span>
      </div>

      <!-- Footer Greeting -->
      <footer class="receipt-footer">
        <p class="thank-you-msg">
          Thank you for choosing <span id="footer-service-name"></span>!
        </p>
      </footer>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
